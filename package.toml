# Distrobox for onelf: upstream's POSIX shell scripts packed as one
# file per architecture. The scripts are used as they publish; the
# only host tool they call outside POSIX and coreutils is curl, for
# the `create --compatibility` table, and the tree carries it. The
# container manager is not carried: distrobox takes it from PATH,
# where the podman package installs itself.
#
# The control repository, onelf-pkgs/.github, bumps the sources here
# when upstream releases and resets `release` to 1. Raise `release`
# by hand when the recipe changes and the sources do not. Releases
# are tagged v<distrobox version>-<release>.
name = "distrobox"
release = 1
arches = ["x86_64", "aarch64"]
self-update = true

[sources.distrobox]
version = "1.8.2.6"
url = "https://github.com/89luca89/distrobox/archive/refs/tags/{version}.tar.gz"
sha256 = "693c85f44720f9c2be8691141eaa1dc2773ee37e63ae02fff8b838dcf54c413e"
upstream = { github = "89luca89/distrobox", tag = "^([0-9.]+)$" }
